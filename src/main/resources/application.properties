# ------------ Cors config ------------
quarkus.http.cors.enabled=true
# Self: ${app.root-url}, Claude.ai:  *.claudemcpcontent.com, MCP Inspector (depending on version): null, http://localhost:6274,http://localhost:6277, http://127.0.0.1:6274, http://127.0.0.1:6277
quarkus.http.cors.origins=null,/http:\/\/localhost:.*/,/http:\/\/127\.0\.0\.1:.*/,${app.root-url},/https:\/\/.*\.claudemcpcontent\.com/
# Trust X-Forwarded-* headers so the scheme/host used to build the OAuth protected-resource
# metadata (and other absolute URLs) reflects the public URL (e.g. an ngrok https tunnel)
# instead of the plain-http connection ngrok makes to the local dev server.
%dev.quarkus.http.proxy.proxy-address-forwarding=true
%dev.quarkus.http.proxy.allow-x-forwarded=true
%dev.quarkus.http.proxy.enable-forwarded-host=true
# ------------ MCP config ------------
# Also emit a TextContent mirror of the structured content for clients (like MCP Inspector)
# that strictly require a non-null 'content' array on every tools/call result.
quarkus.mcp.server.tools.structured-content.compatibility-mode=true
# ------------ Security config ------------
quarkus.http.auth.permission.mcp-endpoints.paths=/mcp/*
quarkus.http.auth.permission.mcp-endpoints.policy=authenticated
# These values have to be set externally (in the .env for example)
#quarkus.oidc.auth-server-url=
#quarkus.oidc.client-id=
#quarkus.oidc.credentials.secret=
quarkus.oidc.authentication.scopes=openid,profile,email,groups
quarkus.oidc.resource-metadata.enabled=true
# Ensures HTTPS url for this resources, even when behind a reverse proxy or ngrok
quarkus.oidc.resource-metadata.force-https-scheme=true
quarkus.oidc.application-type=service
# Accept both forms because the authorization server normalizes the RFC 8707 "resource"
# indicator to include a trailing slash, while the resource-metadata "resource" (and thus
# what clients request as audience) has none.
quarkus.oidc.token.audience=${app.root-url},${app.root-url}/
#------------ Web bundler config ------------
quarkus.web-bundler.dependencies.auto-import=styles
# Separate bundle for the file-selector MCP App (web/fileselector/*)
quarkus.web-bundler.bundle.fileselector=true
quarkus.web-bundler.bundle.fileselector.dir=fileselector
# Live-reloading disabled when testing within claude itself, because it would crash the app
quarkus.web-bundler.browser-live-reload=false
#------------ Application config ------------
nextcloud.app-name=mcp-server
app.user-repository.file=users.json
# These values have to be set externally (in the .env for example)
app.root-url=http://localhost:8080
#app.oidc.static-client-registration.redirect_uris
#nextcloud.url=
#nextcloud.audit.enabled=
#nextcloud.user-oidc=
# Surpress 'Invalid cookie header: "Set-Cookie: nc_username=deleted; ' messages from Sardine
quarkus.log.category."org.apache.http.client.protocol.ResponseProcessCookies".level=ERROR
#------------ Temporary debug ------------
%dev.quarkus.log.category."io.quarkus.security".level=DEBUG
%dev.quarkus.log.category."io.quarkus.oidc".level=DEBUG
%dev.quarkus.log.category."io.quarkiverse.mcp".level=DEBUG
%dev.quarkus.log.category."io.vertx.core.http".level=DEBUG
%dev.quarkus.log.category."io.github.stefanrichterhuber".level=DEBUG